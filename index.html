<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>坦克大战</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      }

      body {
        margin: 0;
        background: #0b0f1a;
        color: #ecf0ff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .layout {
        display: grid;
        gap: 12px;
      }

      canvas {
        background: #1a2136;
        border: 2px solid #4d5b8a;
        box-shadow: 0 0 20px rgba(91, 109, 175, 0.4);
      }

      .panel {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        font-size: 14px;
      }

      kbd {
        background: #2a3454;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid #4e5e97;
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <canvas id="game" width="900" height="600" aria-label="坦克大战游戏画布"></canvas>
      <div class="panel">
        <span>移动：<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键</span>
        <span>射击：<kbd>Space</kbd></span>
        <span id="status">准备开始...</span>
      </div>
    </div>
    <script src="game.js"></script>
  </body>
</html>
